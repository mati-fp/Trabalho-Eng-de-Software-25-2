# Configuracoes do pnpm (a partir do pnpm 11 ficam aqui, nao mais no package.json)

# Quais dependencias podem rodar scripts de build (modulos nativos).
# @scarf/scarf e telemetria: deixamos bloqueado (false).
allowBuilds:
  bcrypt: true
  unrs-resolver: true
  '@scarf/scarf': false

# Desativa a politica de "idade minima de release" do pnpm 11, que bloqueia
# pacotes publicados ha pouco tempo. Mantemos 0 para nao travar atualizacoes
# para versoes recentes (mesmo comportamento que tinhamos com o npm).
# Para endurecer a seguranca de supply-chain, aumente este valor (em minutos).
minimumReleaseAge: 0
